<header class="app-header">
  <div class="app-header-inner">
    <div class="brand">
      <span class="brand-mark"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-jersey-fill"></use></svg></span>
      <span class="brand-name">Jersey HD Studio</span>
    </div>
    <div class="tabs" role="tablist" aria-label="Studio sections">
      <button type="button" class="tab" role="tab" id="tab-recreate" aria-controls="panel-recreate" aria-selected="true">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-wand"></use></svg>Recreate from image
      </button>
      <button type="button" class="tab" role="tab" id="tab-design" aria-controls="panel-design" aria-selected="false" tabindex="-1">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chat"></use></svg>Design from description
      </button>
      <button type="button" class="tab" role="tab" id="tab-history" aria-controls="panel-history" aria-selected="false" tabindex="-1">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-history"></use></svg>History
      </button>
      <button type="button" class="tab" role="tab" id="tab-dashboard" aria-controls="panel-dashboard" aria-selected="false" tabindex="-1">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chart"></use></svg>Dashboard
      </button>
    </div>
    <div class="header-end" id="provider-status"></div>
  </div>
</header>
<div id="banner-slot"></div>
<main id="main" class="app-main" tabindex="-1">

</main>
